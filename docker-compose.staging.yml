services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: staging
      PORT: 8092
      PUBLIC_BASE_URL: https://staging.example.com
      DATABASE_URL: sqlite:///backend/data/hajihaz-staging.db
    ports:
      - "8092:8092"

